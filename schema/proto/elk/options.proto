// Custom protobuf options that tell the code generator how to map a field
// in Elasticsearch, when the default mapping for its protobuf type isn't
// what you want.
//
//   string note = 9 [(elk.field_type) = "text"];
//   VehicleCurrentLocation CurrentLocation = 5 [
//     (elk.geo_point) = {name: "GeoPoint", lat: "Latitude", lon: "Longitude"}
//   ];
syntax = "proto3";

package elk;

import "google/protobuf/descriptor.proto";

// Where to find the coordinates for a geo_point, see (elk.geo_point).
message GeoPoint {
  // Name of the geo_point field that is added.
  string name = 1;
  // Names of the fields, in the same message, that hold the latitude and
  // longitude in degrees.
  string lat = 2;
  string lon = 3;
}

extend google.protobuf.FieldOptions {
  // Elasticsearch field type to use instead of the default, e.g. "geo_point",
  // "text" or "ip". Field numbers 50000-99999 are reserved for custom options.
  string field_type = 50001;
  // On a message field: adds a geo_point field inside it, built from two of
  // its fields. Elasticsearch wants a geo_point as {"lat": .., "lon": ..},
  // while VSS calls them Latitude and Longitude, next to other signals.
  GeoPoint geo_point = 50002;
}
